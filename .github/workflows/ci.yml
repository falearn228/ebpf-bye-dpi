name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Check Rust code formatting
  rustfmt:
    name: Rustfmt Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  # Run clippy lints
  clippy:
    name: Clippy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev \
            make
      
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings

  # Build Rust code
  build-rust:
    name: Build Rust Code
    runs-on: ubuntu-latest
    needs: [rustfmt, clippy]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev \
            make
      
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build daemon
        run: cargo build -p goodbyedpi-daemon --release
      
      - name: Build CLI
        run: cargo build -p goodbyedpi-cli --release
      
      - name: Build proto library
        run: cargo build -p goodbyedpi-proto --release

  # Compile eBPF object
  build-ebpf:
    name: Build eBPF Object
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev \
            make \
            linux-headers-generic
      
      - name: Compile eBPF code
        run: |
          cd ebpf/src
          make goodbyedpi.bpf.o
      
      - name: Upload eBPF object
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-object
          path: ebpf/src/goodbyedpi.bpf.o
          if-no-files-found: error

  # Run Rust tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build-rust
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev \
            make
      
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run tests
        run: cargo test --all -- --nocapture

  # Check documentation
  doc:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev \
            make
      
      - name: Check documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Security audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run audit
        run: cargo audit

  # Build distribution packages (Debian, Fedora, Arch) via the shared Makefile
  packages:
    name: Package (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:trixie
            kind: deb
          - distro: fedora
            image: fedora:latest
            kind: rpm
          - distro: arch
            image: archlinux:latest
            kind: arch
    container: ${{ matrix.image }}
    steps:
      - name: Install toolchain (Debian)
        if: matrix.kind == 'deb'
        run: |
          apt-get update
          apt-get install -y build-essential debhelper clang llvm libbpf-dev libelf-dev zlib1g-dev make pkg-config curl git ca-certificates
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install toolchain (Fedora)
        if: matrix.kind == 'rpm'
        run: dnf install -y rpm-build cargo rust clang llvm libbpf-devel elfutils-libelf-devel zlib-devel make systemd-rpm-macros git tar gzip findutils

      - name: Install toolchain (Arch)
        if: matrix.kind == 'arch'
        run: |
          pacman -Syu --noconfirm --needed base-devel rust clang llvm libbpf git
          useradd -m builder

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ matrix.kind }}" = arch ]; then
            chown -R builder "$GITHUB_WORKSPACE"
            su builder -c "./scripts/build-packages.sh arch"
          else
            ./scripts/build-packages.sh ${{ matrix.kind }}
          fi

      - name: Smoke test installed package
        run: |
          case "${{ matrix.kind }}" in
            deb) apt-get install -y ./dist/*.deb ;;
            rpm) dnf install -y ./dist/*.rpm ;;
            arch) pacman -U --noconfirm dist/*.pkg.tar.zst ;;
          esac
          goodbyedpi --version
          goodbyedpi validate --strict -f /etc/goodbyedpi/profile.txt
          goodbyedpi-daemon --dry-run -i lo --config-file /etc/goodbyedpi/profile.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.distro }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error
