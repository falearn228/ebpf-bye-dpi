# Настройки systemd-сервиса goodbyedpi (EnvironmentFile).
# После правки: `systemctl restart goodbyedpi` (интерфейсы)
# или `goodbyedpi reload` / `systemctl reload goodbyedpi` (только профиль).

# Интерфейсы через запятую. Узнать нужный: `goodbyedpi doctor`
GDPI_INTERFACES=eth0

# Файл профиля (zapret/winws-подобный синтаксис, многострочный)
GDPI_PROFILE=/etc/goodbyedpi/profile.txt

# Доп. флаги демона, например: --no-metrics --metrics-bind 127.0.0.1:9877 --debug
GDPI_OPTS=
